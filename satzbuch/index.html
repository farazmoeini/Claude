<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Overload</title>
  <meta name="description" content="Trainings-App: Übungen, Fortschritt und Pausen tracken. Läuft offline.">
  <meta name="theme-color" content="#23262b">
  <link rel="manifest" href="manifest.webmanifest">

<body>

  <main id="ansicht" tabindex="-1"></main>

  <div id="timer" class="timer" hidden aria-live="polite"></div>

  <nav class="leiste" id="leiste" aria-label="Bereiche">
    <button data-a="tab" data-tab="heute" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20.6 9.4 19.2 8l-1.4 1.4-3.6-3.6 1.4-1.4L14.2 3l-1.4 1.4L11.4 3 9.9 4.4 8.5 3 7.1 4.4l1.4 1.4-3.6 3.6-1.4-1.4L2 9.4l1.4 1.4L2 12.2l1.4 1.4L2 15l1.4 1.4 1.4-1.4 3.6 3.6-1.4 1.4L8.5 21l1.4-1.4 1.4 1.4 1.4-1.4 1.4 1.4 1.4-1.4-1.4-1.4 3.6-3.6 1.4 1.4 1.4-1.4-1.4-1.4 1.4-1.4-1.4-1.4 1.4-1.4ZM8.5 15.4l-1.4-1.4 6.9-6.9 1.4 1.4-6.9 6.9Z"/></svg>

    <button data-a="tab" data-tab="verlauf">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L9 12H6a7 7 0 1 1 2.05 4.95l-1.42 1.42A9 9 0 1 0 13 3Zm-1 5v5l4.25 2.52.77-1.28-3.52-2.09V8H12Z"/></svg>

    <button data-a="tab" data-tab="fortschritt">

      <span>Fortschritt</span></button>
    <button data-a="tab" data-tab="plaene">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19 3h-4.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm2 14H7v-2h7v2Zm3-4H7v-2h10v2Zm0-4H7V7h10v2Z"/></svg>

  </nav>

  <dialog id="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script type="module" src="js/ui.js"></script>
</body>
</html>
