<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zerfallzone</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="hud" class="hidden">
  <div id="fps" class="hidden"></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="teamPanel"></div>
  <div id="phase"><div id="phaseTitle">Landung</div><div id="phaseTimer"></div></div>
  <div id="event" class="hidden"></div>
  <div id="ghostInfo" class="hidden"></div>
  <div id="stats"><span id="alive">0</span> <span data-i18n="hud.left"></span><span id="teamsLeft"></span> · <span id="kills">0</span> Kills · <span id="ping"></span></div>
  <div id="feed"></div>
  <div id="crosshair"><div id="hitmarker"></div></div>
  <div id="dash"></div>
  <div id="dmgDir"></div>
  <div id="dmgNums"></div>
  <div id="killBanner"></div>
  <div id="flash"></div>
  <div id="prompt"></div>
  <!-- Vitalkern: Leben als Ring um ein Sechseck, Rüstung als vier Zellen außen -->
  <div id="vitals">
    <svg viewBox="0 0 140 140" id="vitalSvg" aria-hidden="true">
      <g transform="rotate(135 70 70)">
        <circle class="aseg-bg" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="17 100" stroke-dashoffset="-0.00"/><circle class="aseg" id="aseg0" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="0 100" stroke-dashoffset="-0.00"/><circle class="aseg-bg" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="17 100" stroke-dashoffset="-18.75"/><circle class="aseg" id="aseg1" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="0 100" stroke-dashoffset="-18.75"/><circle class="aseg-bg" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="17 100" stroke-dashoffset="-37.50"/><circle class="aseg" id="aseg2" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="0 100" stroke-dashoffset="-37.50"/><circle class="aseg-bg" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="17 100" stroke-dashoffset="-56.25"/><circle class="aseg" id="aseg3" cx="70" cy="70" r="62" pathLength="100" stroke-dasharray="0 100" stroke-dashoffset="-56.25"/>
        <circle class="hp-track" cx="70" cy="70" r="51" pathLength="100" stroke-dasharray="75 100"/>
        <circle class="hp-lag" id="hpLag" cx="70" cy="70" r="51" pathLength="100" stroke-dasharray="75 100"/>
        <circle class="hp-arc" id="hpArc" cx="70" cy="70" r="51" pathLength="100" stroke-dasharray="75 100"/>
      </g>
      <polygon class="core" points="70.0,30.0 104.6,50.0 104.6,90.0 70.0,110.0 35.4,90.0 35.4,50.0"/>
      <polygon class="core-line" points="70.0,30.0 104.6,50.0 104.6,90.0 70.0,110.0 35.4,90.0 35.4,50.0"/>
    </svg>
    <div class="vnum"><b id="hpNum">100</b><span id="armorNum">50</span></div>
  </div>
  <div id="abilities"><div class="ab" id="ab0"></div><div class="ab" id="ab1"></div></div>
  <div id="weapons"><div class="wp" id="wp0"></div><div class="wp" id="wp1"></div></div>
  <div id="corebar" class="hidden"><div id="coreFill"></div><span id="coreText"></span></div>
  <div id="vignette"></div>
</div>

<!-- Sprachauswahl beim ersten Start -->
<div id="langPick" class="screen hidden">
  <div class="panel small">
    <h1>ZERFALL<span>ZONE</span></h1>
    <h2 data-i18n="pick.title"></h2>
    <div class="langs" id="langButtons"></div>
    <p class="muted" data-i18n="pick.hint"></p>
  </div>
</div>

<!-- Hauptmenü -->
<div id="menu" class="screen hidden">
  <div class="panel">
    <h1>ZERFALL<span>ZONE</span></h1>
    <p class="sub" data-i18n="menu.sub"></p>

    <div class="row">
      <label><span data-i18n="menu.name"></span> <input id="nameInput" maxlength="16" data-i18n-ph="menu.namePh"></label>
      <label><span data-i18n="menu.sens"></span> <input id="sensInput" type="range" min="0.4" max="2.5" step="0.05" value="1"></label>
    </div>
    <div class="row">
      <label><span data-i18n="menu.vol"></span> <input id="volInput" type="range" min="0" max="1" step="0.05" value="0.8"></label>
      <label><span data-i18n="menu.fx"></span> <button id="fxBtn" class="toggle"></button></label>
    </div>
    <div class="row langrow">
      <span class="muted" data-i18n="menu.lang"></span>
      <div class="chips" id="langChips"></div>
    </div>

    <h3 data-i18n="menu.mode"></h3>
    <div class="chips" id="modeChips">
      <button data-mode="solo" data-i18n="mode.solo"></button><button data-mode="duo" data-i18n="mode.duo"></button><button data-mode="trio" data-i18n="mode.trio"></button>
    </div>

    <div class="cols">
      <section>
        <h3 data-i18n="menu.offline"></h3>
        <div class="presets">
          <button data-preset="training" data-i18n="preset.training"></button><button data-preset="normal" data-i18n="preset.normal"></button>
          <button data-preset="hart" data-i18n="preset.hart"></button><button data-preset="albtraum" data-i18n="preset.albtraum"></button>
        </div>
        <div class="botcfg" id="botcfg"></div>
        <div class="muted" id="botTotal"></div>
        <button class="big" id="playOffline" data-i18n="menu.playOffline"></button>
      </section>
      <section>
        <h3 data-i18n="menu.online"></h3>
        <label><span data-i18n="menu.server"></span> <input id="serverInput" placeholder="localhost:7777"></label>
        <p class="muted" id="serverHint"></p>
        <div class="row">
          <button class="big" id="quickBtn" data-i18n="menu.quick"></button>
          <button class="big alt" id="createBtn" data-i18n="menu.create"></button>
        </div>
        <div class="row">
          <input id="codeInput" maxlength="4" placeholder="CODE" class="code">
          <button id="joinBtn" data-i18n="menu.join"></button>
        </div>
        <p class="err" id="netErr"></p>
      </section>
    </div>

    <details>
      <summary data-i18n="menu.help"></summary>
      <div class="cols">
        <table id="helpKb"></table>
        <table id="helpPad"></table>
        <ul id="helpRules"></ul>
      </div>
    </details>
  </div>
</div>

<!-- Lobby -->
<div id="lobby" class="screen hidden">
  <div class="panel">
    <h2><span data-i18n="lobby.title"></span> <span id="lobbyCode" class="code-big"></span></h2>
    <p class="muted" id="lobbyShare"></p>
    <div class="cols">
      <section>
        <h3 data-i18n="lobby.players"></h3>
        <div id="lobbyPlayers"></div>
      </section>
      <section>
        <h3><span data-i18n="lobby.settings"></span> <span class="muted" id="hostNote"></span></h3>
        <div class="chips" id="lobbyModeChips">
          <button data-mode="solo" data-i18n="mode.solo"></button><button data-mode="duo" data-i18n="mode.duo"></button><button data-mode="trio" data-i18n="mode.trio"></button>
        </div>
        <div class="presets" id="lobbyPresets">
          <button data-preset="training" data-i18n="preset.training"></button><button data-preset="normal" data-i18n="preset.normal"></button>
          <button data-preset="hart" data-i18n="preset.hart"></button><button data-preset="albtraum" data-i18n="preset.albtraum"></button>
        </div>
        <div class="botcfg" id="lobbyBotcfg"></div>
        <div class="muted" id="lobbyBotTotal"></div>
      </section>
    </div>
    <p id="lobbyStatus"></p>
    <div class="row">
      <button class="big" id="startBtn" data-i18n="lobby.start"></button>
      <button class="big alt" id="leaveBtn" data-i18n="lobby.leave"></button>
    </div>
  </div>
</div>

<!-- Grafikeinstellungen -->
<div id="settings" class="screen hidden">
  <div class="panel">
    <h2 data-i18n="gfx.title"></h2>
    <h3 data-i18n="gfx.preset"></h3>
    <div class="chips" id="setPresets"></div>
    <div id="setRows"></div>
    <p class="muted" id="setNote"></p>
    <div class="row"><button class="big" id="setBack" data-i18n="gfx.back"></button></div>
  </div>
</div>

<!-- Pause / Ergebnis -->
<div id="overlay" class="screen hidden">
  <div class="panel small">
    <h2 id="ovTitle"></h2>
    <p id="ovText"></p>
    <div class="row">
      <button class="big" id="ovResume"></button>
      <button class="big alt" id="ovGfx" data-i18n="gfx.open"></button>
      <button class="big alt" id="ovQuit"></button>
    </div>
  </div>
</div>

<script type="module" src="client.js"></script>
</body>
</html>
